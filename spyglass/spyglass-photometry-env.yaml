# Conda environment for Spyglass with two open pull requests combined, pinned to the commit
# this pipeline was tested against:
#
#   LorenFrankLab/spyglass#1637  fiber photometry tables (common_photometry), head 7a2b9a12b
#   LorenFrankLab/spyglass#1349  IntervalList ingests the NWB invalid_times table, head 0c2656804
#
# Neither is merged, so the two heads are merged on the CatalystNeuro fork, branch
# hanks-photometry-invalid-times (one conflict, in spyglass/common/__init__.py's __all__ list).
# Re-pin to upstream once both are merged; see "Spyglass version" in README.md.
#
# After creating the env, upgrade pynwb/hdmf (see "Setup" in README.md):
#
#   pip install pynwb==4.1.0 hdmf==6.2.0
#
# The converted Hanks NWB files embed NWB `core` 2.10.0, which only pynwb>=4 can read.
# hdmf>=6 conflicts with ndx-franklab-novela's `hdmf<5` (a Spyglass dependency), so pip
# cannot install both in one step. pip reports the conflict after the upgrade, but Spyglass
# only imports ndx-franklab-novela under TYPE_CHECKING, so ingestion is not affected.
#
# Spyglass imports natively on macOS/Linux, so no WSL is needed.

name: spyglass-photometry
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - hdf5
  - git
  - pip:
      - "git+https://github.com/catalystneuro/spyglass.git@49a1f7d224c1ddf2ac7c2037b2fe303b3d48dcae" # temporary pinned to commit `49a1f7d22` of the CatalystNeuro fork, which combines PRs #1637 and #1349
      - ndx-fiber-photometry==0.2.4
      - ndx-ophys-devices==0.3.1
      - pyyaml
      - jupyter
      - matplotlib
