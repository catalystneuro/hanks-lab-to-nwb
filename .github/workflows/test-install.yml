
name: Installation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"  # First day of the month

jobs:
  run:
    name: Installation on (${{ matrix.os }} with Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow --tags
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package from the lock file
      run: uv sync --locked
    - name: Test converter import
      run: uv run python -c "from hanks_lab_to_nwb.embargo2026 import HanksLabNWBConverter"
