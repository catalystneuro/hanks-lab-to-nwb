# Text specific to this task. Metadata shared by all sessions (experiment description, lab,
# institution, experimenter, keywords, subject) is in general.yaml.
NWBFile:
  session_description: >
    This session contains fiber photometry and behavioral data from a rat performing
    a two-arm bandit task (ClassicRLTasks). On each trial, the rat initiates at the
    center port and chooses either the left or right reward port. Reward probabilities
    are fixed within a block and switch across blocks, requiring the animal to track
    reward history and update port preferences. Behavioral events are controlled and
    recorded by Bpod. Fluorescence signals are acquired simultaneously from up to four
    brain regions using a Doric system with dLight 3.8 (dopamine indicator) at
    isosbestic and ligand excitation wavelengths.

# Row of the processing["tasks"] task table, read by Spyglass's Task and TaskEpoch tables
# (SpyglassEpochInterface). name (the Bpod protocol) and camera_id are set per session in
# convert_session.py. Task is shared by all sessions in a Spyglass database, so the description
# must be the same for every bandit session.
Tasks:
  - description: >-
      Two-arm bandit task. The rat initiates at the center port and chooses the left or right
      reward port; reward probabilities are fixed within a block and switch across blocks.
