# External resources (HERD), shared by the WM and bandit tasks. NeuroConv writes every term stated
# here into the file under /general/external_resources during run_conversion. Each map is keyed by
# the exact value it annotates (NWBFile.institution, NWBFile.experimenter name, Subject.species,
# FiberPhotometryTable location). IDs checked against the EBI Ontology Lookup Service (UBERON,
# NCBITaxon), ROR and ORCID on 2026-11-04.
ExternalResources:
  institution:
    University of California, Davis: { id: "ror:05rrcem69", uri: "https://ror.org/05rrcem69" }
  # ORCID record lists Booras, Stevenson et al., with Hanks (doi:10.1101/2020.11.29.403139).
  experimenter:
    Stevenson, Tanner: { id: "orcid:0000-0002-4016-4099", uri: "https://orcid.org/0000-0002-4016-4099" }
  species:
    Rattus norvegicus: { id: "NCBITaxon:10116", uri: "http://purl.obolibrary.org/obo/NCBITaxon_10116" }
  # strain is not annotated: Long-Evans RRIDs are per supplier, and the supplier is not known yet
  # (see open_questions.md).
  # Keys must match the values of `regions` in sessions.yaml, which become the
  # FiberPhotometryTable locations. UBERON has no dorsolateral, dorsomedial or tail-of-striatum
  # terms, so all three share the dorsal striatum term.
  anatomical_structures:
    Nucleus accumbens: { id: "UBERON:0001882", uri: "http://purl.obolibrary.org/obo/UBERON_0001882" }
    Prelimbic area: { id: "UBERON:8440032", uri: "http://purl.obolibrary.org/obo/UBERON_8440032" }
    Dorsolateral striatum: &dorsal_striatum { id: "UBERON:0005382", uri: "http://purl.obolibrary.org/obo/UBERON_0005382" }
    Dorsomedial striatum: *dorsal_striatum
    Tail of striatum: *dorsal_striatum
