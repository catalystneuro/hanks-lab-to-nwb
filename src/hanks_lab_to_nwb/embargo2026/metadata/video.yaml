# Behavior camera metadata — shared across all sessions.
# Camera is triggered frame-by-frame by the Doric system via DIO04, so frame
# timestamps are derived from DIO04 rising edges in the Doric clock.
#
# Hardware fields below are read from the per-session video sidecar
# mov_{session_id}.doric:
#   Configurations/BehaviorCamera        @DeviceName = "DMK 33UX290", @SerialNumber = "35320610"
#   Configurations/BehaviorCamera/Settings  @ResolutionWidth/Height = 1440x1080, @FPS = 30,
#                                           @Exposure = 0.016 s, @Gain = 18, @TriggerMode = 1
# TODO: confirm the lens and the pixel size with the lab (not recorded by the acquisition
# software). Until then lens is "unknown" and meters_per_pixel is 0.0, Spyglass's default.

# ── Device models ──────────────────────────────────────────────────────────────
DeviceModels:
  behavior_camera_model:
    name: behavior_camera_model
    manufacturer: The Imaging Source
    model_number: DMK 33UX290
    description: >-
      Monochrome USB 3.0 industrial camera (Sony IMX290 CMOS sensor) used for behavior video.

# ── Device instances ───────────────────────────────────────────────────────────
# Written as an ndx-franklab-novela CameraDevice by HanksLabNWBConverter, because Spyglass's
# VideoFile table reads the camera from the video's device. Spyglass parses the camera ID from
# the name, so it must be "camera_device <id>"; camera_name is the name Spyglass shows.
Devices:
  behavior_camera:
    name: camera_device 0
    device_model_metadata_key: behavior_camera_model
    serial_number: "35320610"
    description: >-
      Camera recording animal behavior during fiber photometry sessions.
      Triggered frame-by-frame by the Doric acquisition system via DIO04.

BehaviorCamera:
  camera_name: BehaviorCamera
  frame_rate: 30.0
  lens: unknown  # placeholder, see TODO above
  meters_per_pixel: 0.0  # placeholder, see TODO above

Behavior:
  ExternalVideos:
    behavior_video:
      name: BehaviorVideo
      description: >-
        Top-down video of rat behavior during the task session.
        Frame timestamps are derived from DIO04 rising edges in the Doric clock
        and are aligned to the same reference as the fiber photometry data.
      unit: Frames
      device_metadata_key: behavior_camera
